name: CD Frontend

on:
  push:
    tags:
      - 'frontend-v*' 
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy-frontend:
    name: CD / Deploy Frontend to S3
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Find successful CI run
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in {1..40}; do
            RUNS="$(gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f event=push \
              -f per_page=20)"

            RUN_ID="$(jq -r '.workflow_runs[] | select(.conclusion == "success") | .id' <<< "$RUNS" | head -n 1)"
            if [[ -n "$RUN_ID" ]]; then
              echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            FAILED="$(jq -r '.workflow_runs[] | select(.status == "completed" and .conclusion != "success") | .conclusion' <<< "$RUNS" | head -n 1)"
            if [[ -n "$FAILED" ]]; then
              echo "::error::CI for commit $GITHUB_SHA completed with result: $FAILED"
              exit 1
            fi

            echo "Waiting for CI artifact for commit $GITHUB_SHA ($attempt/40)..."
            sleep 15
          done

          echo "::error::No successful push CI run found for commit $GITHUB_SHA."
          exit 1

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci-run.outputs.run-id }}

      - name: Verify frontend artifact
        run: test -f frontend/dist/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        env:
          FRONTEND_S3_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
        run: aws s3 sync frontend/dist "s3://$FRONTEND_S3_BUCKET" --delete
