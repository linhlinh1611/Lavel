name: CD Backend

on:
  push:
    tags:
      - 'backend-v*' 
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  backend-image:
    name: CD / Build & Push Backend Image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Extract Version Tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#backend-}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION_TAG: ${{ steps.get_version.outputs.VERSION }}
        run: echo "uri=$ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push image with Version Tag
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          docker build -f backend/Dockerfile \
            -t "$IMAGE_URI" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            backend

          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  deploy-backend:
    name: CD / Deploy to EC2
    needs: backend-image
    runs-on: ubuntu-latest
    environment: production
    env:
      BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
      BACKEND_USER: ${{ secrets.BACKEND_USER }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Allow runner SSH access
        id: open-ssh
        run: |
          set -euo pipefail
          : "${BACKEND_HOST:?Missing GitHub secret BACKEND_HOST}"

          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=$BACKEND_HOST" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)"
          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "::error::BACKEND_HOST is not the public IPv4 address of a running EC2 instance in AWS_REGION."
            exit 1
          fi

          ATTACHED_GROUPS="$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].SecurityGroups[].GroupId' \
            --output text)"
          EC2_SECURITY_GROUP_ID="$(awk '{print $1}' <<< "$ATTACHED_GROUPS")"
          if [[ -z "$EC2_SECURITY_GROUP_ID" || "$EC2_SECURITY_GROUP_ID" == "None" ]]; then
            echo "::error::No Security Group is attached to the EC2 instance."
            exit 1
          fi

          RUNNER_IP="$(curl --proto '=https' --tlsv1.2 --fail --silent https://checkip.amazonaws.com | tr -d '[:space:]')"
          [[ "$RUNNER_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RULE_ID="$(aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)"
          echo "rule-id=$RULE_ID" >> "$GITHUB_OUTPUT"
          echo "security-group-id=$EC2_SECURITY_GROUP_ID" >> "$GITHUB_OUTPUT"

      - name: Configure SSH and environment
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
          BACKEND_SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${BACKEND_HOST:?Missing GitHub secret BACKEND_HOST}"
          : "${BACKEND_USER:?Missing GitHub secret BACKEND_USER}"
          : "${BACKEND_SSH_KEY:?Missing GitHub secret BACKEND_SSH_KEY}"
          : "${BACKEND_ENV_FILE:?Missing GitHub secret BACKEND_ENV_FILE}"

          if [[ "$BACKEND_HOST" == *://* ]]; then
            echo "::error::BACKEND_HOST must contain only an IP address or domain, without http:// or https://"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          if [[ "$BACKEND_SSH_KEY" == *"BEGIN"*"PRIVATE KEY"* ]]; then
            printf '%b\n' "$BACKEND_SSH_KEY" | tr -d '\r' > ~/.ssh/lavel_deploy_key
          else
            if ! printf '%s' "$BACKEND_SSH_KEY" | base64 --decode > ~/.ssh/lavel_deploy_key 2>/dev/null; then
              echo "::error::BACKEND_SSH_KEY is neither a valid PEM private key nor valid Base64."
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/lavel_deploy_key
          if ! ssh-keygen -y -f ~/.ssh/lavel_deploy_key >/dev/null 2>&1; then
            echo "::error::BACKEND_SSH_KEY could not be parsed. Store the Base64 content of the EC2 .pem file in this secret."
            exit 1
          fi

          for attempt in {1..6}; do
            if ssh-keyscan -T 10 -H "$BACKEND_HOST" > ~/.ssh/known_hosts; then
              break
            fi
            sleep 5
          done
          if [[ ! -s ~/.ssh/known_hosts ]]; then
            echo "::error::Cannot reach $BACKEND_HOST on SSH port 22. Check the EC2 Security Group and BACKEND_HOST."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/lavel_deploy_key "$BACKEND_USER@$BACKEND_HOST" true

          trap 'rm -f /tmp/lavel_backend.env' EXIT
          printf '%s\n' "$BACKEND_ENV_FILE" > /tmp/lavel_backend.env
          chmod 600 /tmp/lavel_backend.env
          scp -i ~/.ssh/lavel_deploy_key /tmp/lavel_backend.env "$BACKEND_USER@$BACKEND_HOST:~/lavel_backend.env"

      - name: Pull image and run container
        run: |
          set -euo pipefail
          AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          VERSION_TAG="${GITHUB_REF_NAME#backend-}"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG"

          if [[ ! "$IMAGE_URI" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/.+:.+$ ]]; then
            echo "::error::Invalid ECR image URI. Check AWS_REGION and ECR_REPOSITORY."
            exit 1
          fi

          ssh -i ~/.ssh/lavel_deploy_key "$BACKEND_USER@$BACKEND_HOST" \
            "AWS_REGION='$AWS_REGION' IMAGE_URI='$IMAGE_URI' bash -s" <<'REMOTE'
          set -euo pipefail
          : "${AWS_REGION:?Missing AWS_REGION}"
          : "${IMAGE_URI:?Missing IMAGE_URI}"
          ECR_REGISTRY="${IMAGE_URI%%/*}"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker pull "$IMAGE_URI"
          chmod 600 "$HOME/lavel_backend.env"
          docker rm -f lavel-backend 2>/dev/null || true
          docker run -d \
            --name lavel-backend \
            --restart unless-stopped \
            --env-file "$HOME/lavel_backend.env" \
            -p 8000:8000 \
            -v lavel_database:/app/data \
            -v lavel_uploads:/app/uploads \
            "$IMAGE_URI"
          REMOTE

      - name: Remove runner SSH access
        if: always() && steps.open-ssh.outputs.rule-id != ''
        env:
          EC2_SECURITY_GROUP_ID: ${{ steps.open-ssh.outputs.security-group-id }}
          SECURITY_GROUP_RULE_ID: ${{ steps.open-ssh.outputs.rule-id }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --security-group-rule-ids "$SECURITY_GROUP_RULE_ID"
